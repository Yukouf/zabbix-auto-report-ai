name: Security scan (SAST + SCA + secrets)

on:
  push:
    branches: [ main, master ]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # scan hebdo automatique (lundi 6h)

jobs:
  security:
    name: Contrôles de sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0   # nécessaire pour Gitleaks (historique complet)

      # ── 1. SAST : analyse du code Python (Semgrep) ─────────────────
      # Semgrep tourne en conteneur, aucun token requis. Gate : échec si
      # des findings de sévérité ERROR sont trouvés.
      - name: SAST — Semgrep
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep semgrep scan \
            --config=auto --error /src || { echo "SAST: vulnérabilités détectées"; exit 1; }

      # ── 2. SCA : dépendances vulnérables (pip-audit) ──────────────
      - name: SCA — pip-audit (dépendances)
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --desc on
          else
            echo "Pas de requirements.txt — scan SCA ignoré"
          fi

      # ── 3. Secrets : clés commitées par erreur (Gitleaks) ─────────
      - name: Secrets — Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Containers : image Docker (Trivy) — seulement si Dockerfile ─
  container-scan:
    name: Scan image Docker (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build image
        if: hashFiles('Dockerfile') != ''
        run: docker build -t app:test .
      - name: Trivy — scan de l'image
        if: hashFiles('Dockerfile') != ''
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          image-ref: app:test
          format: table
          exit-code: '1'            # ← LA GATE : échoue si vulnérabilité critique
          severity: CRITICAL,HIGH
          ignore-unfixed: true
